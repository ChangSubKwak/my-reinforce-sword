# Render Blueprint — 자동 배포 설정
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-reinforce-sword
    runtime: node
    plan: free
    buildCommand: npm ci   # v333 lockfile 커밋 후 — 결정적 설치(lockfile 정확 재현, range 재해석 안 함)
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
